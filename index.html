<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeepney Fare Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="header__container">
          <div class="header__container__siteTitle">
            Jeepney Fare Calculator
          </div>
          <nav class="header__container__nav">
            <ul>
              <li><a href="#home">Home</a></li>
              <li><a href="#finder">Route Finder</a></li>
              <li><a href="#about">About</a></li>
              <li><a href="#contact">Contact Us</a></li>
            </ul>
          </nav>
        </div>
      </header>
      <section id="hero">
        <div class="hero__container">
          <div class="hero__container__title">
            Struggling How Much From Your Destination?
          </div>
          <div class="hero__container__subtitle">
            Oops! Oops! Oops! Jeepney Fare Calculator is here! Calculate your
            jeepney fare before you board!
          </div>
        </div>
      </section>
      <section id="route" class="route">
        <div id="routeError"></div>

        <div class="route__dashboard">
          <div class="route__dashboard__line_selection">
            <label for="routeLines">Route</label>
            <select name="routeLines" id="routeLines">
              <option value="0">Select Route</option>
              <option value="1">San Pedro Town Proper - Langgam</option>
              <option value="2">Pacita - Alabang</option>
              <!-- <option value="3">San Pedro - Binan Town Proper</option> -->
              <!-- <option value="4">San Pedro - Calamba</option> -->
            </select>
          </div>
          <div class="route__dashboard__option_1">
            <label for="routeOrigin">From:</label>
            <select name="routeOrigin" id="routeOrigin" disabled>
              <!-- Insert Routes Here -->
            </select>
          </div>
          <div class="route__dashboard__option_2">
            <label for="routeDestination">To:</label>
            <select name="routeDestination" id="routeDestination" disabled>
              <!-- Insert Routes Here -->
            </select>
          </div>
          <div class="route__dashboard__submit">
            <button id="routeSubmit">Calculate</button>
          </div>
        </div>
        <!-- Result -->
        <div id="routeResult" class="route__result hidden">
          <div class="route__dashboard__result">
            <p>Your Jeepney Fare is</p>
            <p id="fareText">0</p>
          </div>
        </div>
      </section>
      <footer></footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
